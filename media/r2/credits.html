<head>

  <style>
    *{box-sizing:border-box}body{margin:0;background:#073245;color:#f1f8f7;font:16px/1.8 "Segoe UI","Microsoft YaHei",Arial,sans-serif}main{max-width:1000px;margin:auto;padding:48px 24px 80px}header{border-bottom:1px solid #ffffff30;padding-bottom:30px}nav{display:flex;justify-content:space-between;gap:20px;align-items:center}a{color:#bceee6;text-underline-offset:4px;overflow-wrap:anywhere}select{background:#0a4054;color:white;padding:8px;border:1px solid #bad3da;border-radius:4px}h1{font-size:clamp(2rem,5vw,3.5rem);font-weight:350;line-height:1.2}h2{font-weight:450;font-size:1.45rem;line-height:1.4}p{color:#c7dce2}article{padding:30px 0;border-bottom:1px solid #ffffff30;scroll-margin-top:25px}dl{display:grid;grid-template-columns:140px minmax(0,1fr);gap:12px 24px}dt{color:#acd8db;font-size:.8rem}dd{margin:0;overflow-wrap:anywhere}code{font-size:.85rem}.status{padding:14px 18px;background:#0c4658;border-left:3px solid #a6e8e1}.pending{border-left-color:#ebcb8b}small{font-size:.8rem}noscript{display:block;padding:20px}:focus-visible{outline:3px solid #a6e8e1;outline-offset:4px}@media(max-width:600px){dl{grid-template-columns:1fr;gap:4px}dd{margin-bottom:14px}main{padding-top:25px}}
  </style>
</head>
<body><main>
  <header id="original-work"><nav><a href="/#/home">ONE OCEAN, MANY EYES ↗</a><select aria-label="Language / 语言 / Язык"><option value="zh">中文</option><option value="en">English</option><option value="ru">Русский</option></select></nav><h1 id="title">媒体来源与署名</h1><p id="intro"></p><p id="boundary"></p><small id="date"></small></header>

</main>
<script>

const copy={
 zh:{title:'媒体来源与署名',intro:'这些真实影像用于海洋科学教育展览。来源链接指向具体素材或明确注明的待核验记录；不代表来源机构参与或背书本项目。',boundary:'当前仅列启用且通过本项目准入核查的素材。原待核验影像已替换并排除上传。原创 SVG 无外部影像素材；教学插画不代表科研观测。',date:'核查日期',files:'项目文件',creator:'机构 / 作者',source:'具体源页',download:'源文件地址',format:'原始格式',usage:'使用位置',edit:'裁剪 / 剪辑记录',licence:'使用条款',attribution:'署名',status:'核验状态',missing:'尚未恢复，不能声称已核验',technical:'原始素材标题、署名及技术记录保留原文。'},
 en:{title:'Footage & image credits',intro:'Real imagery supports this ocean-science educational exhibition. Links identify specific material or explicitly provisional records. Source institutions do not endorse this project.',boundary:'Only active assets checked for this educational project are listed. Unverified originals have been replaced and excluded from upload. Original SVG artwork uses no external imagery; teaching illustrations are not observations.',date:'Checked on',files:'Project files',creator:'Institution / creator',source:'Specific source page',download:'Original asset address',format:'Original format',usage:'Used at',edit:'Crop / edit record',licence:'Reuse terms',attribution:'Credit',status:'Verification status',missing:'Not recovered; not verified',technical:'Original titles, attribution and technical records retain their source wording.'},
 ru:{title:'Источники изображений и видео',intro:'Реальные изображения используются в образовательной выставке о науке об океане. Ссылки ведут к конкретным материалам или явно предварительным записям. Организации-источники не подтверждают и не поддерживают этот проект.',boundary:'Указаны только используемые материалы, проверенные для этого учебного проекта. Непроверенные оригиналы заменены и исключены из загрузки. Оригинальные SVG не содержат сторонних изображений; учебные схемы не являются наблюдениями.',date:'Дата проверки',files:'Файлы проекта',creator:'Организация / автор',source:'Страница материала',download:'Адрес исходного файла',format:'Исходный формат',usage:'Место использования',edit:'Кадрирование / монтаж',licence:'Условия использования',attribution:'Авторство',status:'Статус проверки',missing:'Не восстановлен; не проверен',technical:'Исходные названия, сведения об авторстве и технические записи сохранены на языке источника.'}
}
const link=(url,text)=>{const a=document.createElement('a');a.href=url;a.textContent=text;a.target='_blank';a.rel='noreferrer';return a}
fetch('manifest.json').then(r=>{if(!r.ok)throw Error(r.status);return r.json()}).then(manifest=>{
 const select=document.querySelector('select');select.value=['zh','en','ru'].includes(new URLSearchParams(location.search).get('lang'))?new URLSearchParams(location.search).get('lang'):'zh'
 function render(){const lang=select.value,c=copy[lang];document.documentElement.lang=lang;document.title=c.title+' · ONE OCEAN, MANY EYES';document.querySelector('#title').textContent=c.title;document.querySelector('#intro').textContent=c.intro;document.querySelector('#boundary').textContent=c.boundary+' '+c.technical;document.querySelector('#date').textContent=c.date+': '+manifest.checkedOn;const target=document.querySelector('#credits');target.replaceChildren();for(const item of manifest.items){const article=document.createElement('article');article.id=item.id;const h=document.createElement('h2');h.textContent=item.title;article.append(h);const dl=document.createElement('dl');for(const [label,key]of [['files','files'],['creator','creator'],['source','sourcePage'],['download','downloadUrl'],['format','originalFormat'],['usage','usedAt'],['edit','edit'],['licence','licenceUrl'],['attribution','attribution']]){const dt=document.createElement('dt'),dd=document.createElement('dd');dt.textContent=c[label];const value=item[key];if(typeof value==='string'&&value.startsWith('https://'))dd.append(link(value,value));else dd.textContent=Array.isArray(value)?value.join(' · '):(value||c.missing);dl.append(dt,dd)}article.append(dl);const status=document.createElement('p');status.className='status'+(item.pending?' pending':'');status.textContent=c.status+': '+item.status[lang];article.append(status);target.append(article)}if(location.hash)document.getElementById(location.hash.slice(1))?.scrollIntoView()}
 select.addEventListener('change',render);render()
}).catch(()=>{document.querySelector('#credits').textContent='媒体清单加载失败 / Media manifest unavailable / Список материалов недоступен. manifest.json';})
</script>
</body></html>
